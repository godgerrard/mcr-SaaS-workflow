name: CI

on:
  push:
    branches: [master]
  pull_request:

# Runs share one live Supabase project — serialize, never overlap.
concurrency:
  group: ci-live-db
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # seed/test:security use `node --env-file=.env.local`, which errors if
      # the file is missing; vars come from job env, so an empty file is fine.
      - run: touch .env.local
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm run test:reducer
      - run: npm run seed
      - run: npm run test:security
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
